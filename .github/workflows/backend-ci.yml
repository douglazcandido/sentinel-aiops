name: Backend CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar ruff
        run: pip install ruff==0.6.9

      - name: Lint (ruff)
        run: ruff check .

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Rodar testes unitarios (sem banco de dados)
        # cobertura medida so em app.core (unico pacote exercitado por esses testes);
        # limiar com margem abaixo do real (~93%) para nao quebrar por pequenas variacoes
        run: pytest tests/core --cov=app.core --cov-report=term-missing --cov-fail-under=85

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.2
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: chave-de-teste-ci-nao-usar-em-producao
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Rodar testes de integracao (API + servicos + Postgres real)
        # cobertura do pacote app inteiro (main.py importa todos os routers); limiar
        # com margem abaixo do real (~73%) para nao quebrar por pequenas variacoes
        run: pytest tests/api tests/services --cov=app --cov-report=term-missing --cov-fail-under=65

  data-pipeline-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.2
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: chave-de-teste-ci-nao-usar-em-producao
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Bootstrap do schema (bronze, gold, auth)
        run: python -m pipeline.bootstrap

      - name: Ingestao do dataset de origem para o bronze
        run: python -m pipeline.ingest

      - name: dbt run (silver)
        run: dbt run --profiles-dir dbt --project-dir dbt --select silver --threads 1

      - name: dbt run (gold)
        run: dbt run --profiles-dir dbt --project-dir dbt --select gold --threads 1

      - name: dbt test (silver + gold)
        run: dbt test --profiles-dir dbt --project-dir dbt --select silver gold --threads 1

      - name: Rodar testes sobre dados reais do pipeline (sem etapa de ML)
        # cobertura do pacote app inteiro; limiar com margem abaixo do real (~70%)
        run: pytest tests/data_pipeline --cov=app --cov-report=term-missing --cov-fail-under=60

  build-and-push:
    # so builda/publica a imagem depois que todo o CI passar, e so em push
    # direto na main (nunca em pull_request, nem de forks)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, unit-test, integration-test, data-pipeline-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup do Docker Buildx (necessario para o cache type=gha)
        uses: docker/setup-buildx-action@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem do backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sentinel-backend:latest
            ghcr.io/${{ github.repository_owner }}/sentinel-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Stack de producao: sobe a partir de imagens ja publicadas no GHCR pelo CI
# (nao builda nada localmente). Requer um arquivo .env ao lado deste arquivo
# com POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB e JWT_SECRET_KEY --
# esse .env NUNCA e commitado, e criado uma vez direto no servidor.
#
# Uso no servidor: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:17.2
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/douglazcandido/sentinel-backend:latest
    container_name: sentinel-backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/douglazcandido/sentinel-frontend:latest
    container_name: sentinel-frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: sentinel-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
